name: CI — Lint, Tests & Build

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  # ── Analyse statique + tests ───────────────────────────────────────────
  lint-and-test:
    name: Lint & Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Installation de Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.2'
          channel: 'stable'
          cache: true

      - name: Installation des dépendances
        run: flutter pub get

      - name: Génération des fichiers l10n
        run: flutter gen-l10n

      - name: Analyse statique (flutter analyze)
        run: flutter analyze --no-fatal-infos

      - name: Vérification du formatage
        run: dart format --output=none --set-exit-if-changed lib/ test/

      - name: Tests unitaires et widget
        run: flutter test --coverage

      - name: Upload couverture de code
        uses: codecov/codecov-action@v4
        with:
          file: coverage/lcov.info
          fail_ci_if_error: false

  # ── Build APK Android ─────────────────────────────────────────────────
  build-android:
    name: Build APK
    runs-on: ubuntu-latest
    needs: lint-and-test

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Installation de Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Installation de Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.2'
          channel: 'stable'
          cache: true

      - name: Installation des dépendances
        run: flutter pub get

      - name: Génération des fichiers l10n
        run: flutter gen-l10n

      - name: Build APK release
        run: flutter build apk --release --split-per-abi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: apk-release
          path: build/app/outputs/flutter-apk/*.apk
          retention-days: 30
